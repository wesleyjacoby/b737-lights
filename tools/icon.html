<!doctype html>
<meta charset="utf-8">
<style>
@font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url(../fonts/barlow-condensed-latin-600-normal.woff2) format("woff2"); }
html, body { margin: 0; height: 100%; background: #161c21; }
.stage { width: 100vw; height: 100vh; display: grid; place-items: center; }
.tile { width: var(--w); height: var(--h); border-radius: var(--r); background: #f3a817; color: #1b1303; display: grid; place-items: center;
  font: 600 var(--fs)/1 "Barlow Condensed", sans-serif; letter-spacing: .04em; box-shadow: 0 0 calc(var(--w) * .12) calc(var(--w) * .02) rgba(243,168,23,.55); }
</style>
<div class="stage"><div class="tile" id="t">737</div></div>
<script>
// ?s=<pixel size>&k=<fraction of the icon the tile fills>
const q = new URLSearchParams(location.search), s = +q.get('s') || 512, k = +q.get('k') || .62;
const t = document.getElementById('t').style;
t.setProperty('--w', (s * k) + 'px'); t.setProperty('--h', (s * k * .6) + 'px'); t.setProperty('--r', (s * k * .07) + 'px'); t.setProperty('--fs', (s * k * .46) + 'px');
</script>
